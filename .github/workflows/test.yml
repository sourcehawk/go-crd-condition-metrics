name: Go
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions

      # Version comes from .tool-versions so CI and local asdf installs cannot
      # drift apart, and renovate keeps a single place up to date.
      - name: Install golangci-lint
        run: |
          version=$(awk '$1 == "golangci-lint" { print $2; exit }' .tool-versions)
          echo "Installing golangci-lint v$version"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" "v$version"

      - name: Test
        run: make all

      # promtool is not part of `make all` so that contributors without it can
      # still run the Go test suite. Renovate updates PROMETHEUS_VERSION through
      # the custom manager in renovate.json.
      - name: Install promtool
        env:
          # renovate: datasource=github-releases depName=prometheus/prometheus
          PROMETHEUS_VERSION: '3.16.0'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz" \
          | tar -xz --strip-components=1 -C "$HOME/.local/bin" "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test alerts
        run: make test-alerts
