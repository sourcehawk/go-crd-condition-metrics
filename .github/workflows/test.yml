name: Go
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Setup asdf
        uses: asdf-vm/actions/setup@v4

      # Versions come from .tool-versions so CI and local asdf installs cannot
      # drift apart, and renovate keeps a single place up to date.
      # asdf-vm/actions/install installs every tool in .tool-versions, so it
      # would install Go again on top of setup-go.
      - name: Install tools with asdf
        run: |
          for tool in golangci-lint promtool; do
            asdf plugin add "$tool"
            asdf install "$tool"
          done

      - name: Test
        run: make all

      # promtool is not part of `make all` so that contributors without it can
      # still run the Go test suite.
      - name: Test alerts
        run: make test-alerts
